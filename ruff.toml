# Lint configuration. The repository had none, so `ruff` ran with its defaults —
# which disagree with the project's own consistent style and made the tool unusable
# as a gate.
#
# The rule set below is chosen to be **blocking from day one**. A linter that is
# advisory, or scoped so narrowly it cannot fail, teaches everyone to ignore it.
# Everything selected here is green across the repository right now.

target-version = "py312"   # matches the container images, not the dev machine
line-length = 100

exclude = [
    ".venv",
    "evals/.artifacts",
    "migrations/versions",   # generated by Alembic; its style is Alembic's
]

[lint]
select = [
    "F",    # pyflakes — undefined names, unused imports: real bugs
    "E4",   # import shadowing and misplacement
    "E7",   # comparison and statement mistakes
    "E9",   # syntax and IO errors
    "I",    # import sorting — mechanical, auto-fixable, ends style arguments
    "B",    # bugbear — mutable defaults, blind excepts, broken-chain raises
]

ignore = [
    # FastAPI's whole dependency-injection idiom is `Depends(...)` in a default
    # argument. Flagging it would mean a noqa on every route handler.
    "B008",
]

# Deliberately NOT selected, with reasons, so the next person does not have to guess:
#
#   "UP"  — pyupgrade would rewrite `timezone.utc` to `UTC`, `Optional[X]` to
#           `X | None` and `Dict` to `dict` across dozens of files. The project is
#           already internally consistent; churning it adds review noise and no
#           correctness. Worth doing as its own commit, not as a side effect of CI.
#   "S"   — security linting is `bandit`'s job here, and the codebase already carries
#           `# nosec` comments that ruff does not honour. Two tools disagreeing about
#           suppression syntax is worse than one tool doing the work.
#   "SIM" — mostly argues for collapsing nested `with` statements. The nested form is
#           clearer in the agent graph nodes, where each context means something.
#   "ANN"/"D" — annotation and docstring coverage. Worth adding, but as a gradual
#           per-directory ratchet rather than a 700-violation wall.
#   "E501" — line length is reported by `line-length` above but not enforced as an
#           error; several deliberate long strings (prompts, SQL) would need noqa.

[lint.per-file-ignores]
# Tests assert. That is what they are for.
"**/tests/**" = ["S101"]
"evals/**" = ["S101"]
# Path bootstrapping has to run before the imports it enables; the files that do it
# already carry explicit `# noqa: E402` markers.
"**/conftest.py" = ["E402"]

[lint.isort]
# Without this, ruff treats the first-party packages as third-party and sorts them
# into the wrong block — which makes `I001` disagree with a developer's local setup.
known-first-party = [
    "observability",
    "packages",
    "evals",
    "scripts",
    "_common",
    "agents",
    "auth",
    "core",
    "middleware",
    "routes",
    "workers",
    "claims",
    "documents",
    "policies",
    "users",
]
