[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-common"
version = "0.1.0"
description = "Shared schemas, enums and exceptions for Insurance Automation System"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.11.4",
]

[tool.setuptools.packages.find]
where = ["."]
