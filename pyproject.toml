[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-automation"
version = "0.1.0"
description = "Multi-agent insurance claim automation system"
requires-python = ">=3.11"
authors = [
    {name = "InsureAI Team", email = "team@insureai.local"},
]
license = {text = "MIT"}

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "B", "A"]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true
pretty = true

[[tool.mypy.overrides]]
module = "migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "pdf2image.*",
    "pytesseract.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers"
testpaths = [
    "ai-orchestrator/tests",
    "mcp-servers/claims/tests",
    "mcp-servers/policies/tests",
    "mcp-servers/users/tests",
    "mcp-servers/documents/tests",
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
    "asyncio: async tests",
]

[tool.coverage.run]
source = [
    "ai-orchestrator",
    "mcp-servers",
    "deployment",
    "observability",
    "packages",
    "pipelines",
]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
