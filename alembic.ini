# Alembic Configuration

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(created_at)s_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to zoneinfo.ZoneInfo()
# defaults to the local timezone
#timezone =

# max length of characters to apply to the
# "slug" field when generating a new migration name
# defaults to 40
# truncate_slug_len = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# If false, revision files
# are written in plaintext as opposed to byte string
# raw_binary = false

# dependencies to other migration files
# depends_on =

# This setting configures the logging system. By default this is a system
# logger defined by the file handler below. Logging was configured
# conditionally in order to avoid generating empty logging setup on
# cases where another logging system already existed for the application
# [loggers]
# keys = root,sqlalchemy,alembic

# [handlers]
# keys = console

# [formatters]
# keys = generic

# [logger_root]
# level = WARN
# handlers = console
# qualname =

# [logger_sqlalchemy]
# level = WARN
# handlers =
# qualname = sqlalchemy.engine

# [logger_alembic]
# level = INFO
# handlers =
# qualname = alembic

# [handler_console]
# class = StreamHandler
# args = (sys.stderr,)
# level = NOTSET
# formatter = generic

# [formatter_generic]
# format = %(levelname)-5.5s [%(name)s] %(message)s
# datefmt = %H:%M:%S

# The output encoding used to render unicode characters
# for the console to stdout.
# returns 'mock' for tests.
# returns 'strict' for enforced string encoding.
output_encoding = utf-8

# sqlalchemy.url is intentionally NOT set here.
# It is loaded dynamically from DATABASE_URL in .env via migrations/env.py
# This keeps credentials out of version control (Rule 8: Secrets Management)


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
