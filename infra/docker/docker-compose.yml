# ============================================================
# Docker Compose — Local Dev Environment (C3.1)
#
# Default (talks to Neon — your .env DATABASE_URL):
#     docker compose -f infra/docker/docker-compose.yml up --build
#
# With local Postgres (offline / no Neon access):
#     docker compose -f infra/docker/docker-compose.yml \
#         --profile local-db up --build
#     # Then in .env temporarily:
#     # DATABASE_URL=postgresql://insureai:dev@postgres:5432/insureai
#
# Stop everything:
#     docker compose -f infra/docker/docker-compose.yml down
#
# All env vars come from the project root .env (gitignored, Rule 8).
# ============================================================

services:
  # ── Next.js UI ──────────────────────────────────────────────
  ui:
    build:
      context: ../../ui                   # ui folder
      dockerfile: Dockerfile
    image: insureai-ui:dev
    container_name: insureai-ui
    environment:
      # Browser connects via host port mapping, so localhost:8000 is correct
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      - orchestrator
    restart: unless-stopped
    networks:
      - insureai

  # ── Orchestrator (FastAPI) ──────────────────────────────────
  orchestrator:
    build:
      context: ../..                      # project root
      dockerfile: infra/docker/Dockerfile.orchestrator
    image: insureai-orchestrator:dev
    container_name: insureai-orchestrator
    env_file:
      - ../../.env                         # reads project-root .env
    environment:
      # Always bind to the container's 0.0.0.0 regardless of host setting
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      # MCP service URLs — container-network addresses (Rule 8)
      MCP_CLAIMS_URL:    "http://mcp-claims:8002/sse"
      MCP_POLICIES_URL:  "http://mcp-policies:8003/sse"
      MCP_USERS_URL:     "http://mcp-users:8004/sse"
      MCP_DOCUMENTS_URL: "http://mcp-documents:8005/sse"
      MCP_LEGACY_URL:    "http://mcp-legacy:8006/sse"
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - insureai
    volumes:
      # Persist uploaded PDFs across container rebuilds so the
      # /claims/{id}/reanalyze endpoint can find the original document.
      - claim_uploads:/tmp/claim-uploads
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mcp-claims:
        condition: service_started
      mcp-policies:
        condition: service_started
      mcp-users:
        condition: service_started
      mcp-documents:
        condition: service_started
      mcp-legacy:
        condition: service_started

  # ── MCP: claims (read + write-restricted) ──────────────────
  # Master Patch Part 1: NO host port mapping — `expose` makes the
  # service reachable on the insureai docker network only. Every
  # request is gated by MCPAuthMiddleware (X-MCP-Secret header).
  mcp-claims:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.orchestrator
    image: insureai-orchestrator:dev
    container_name: insureai-mcp-claims
    env_file:
      - ../../.env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8002"
    command: ["python", "mcp-servers/claims/server.py"]
    expose:
      - "8002"
    restart: unless-stopped
    networks:
      - insureai
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # ── MCP: policies (read-only) ───────────────────────────────
  mcp-policies:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.orchestrator
    image: insureai-orchestrator:dev
    container_name: insureai-mcp-policies
    env_file:
      - ../../.env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8003"
    command: ["python", "mcp-servers/policies/server.py"]
    expose:
      - "8003"
    restart: unless-stopped
    networks:
      - insureai
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # ── MCP: users (read-only) ──────────────────────────────────
  mcp-users:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.orchestrator
    image: insureai-orchestrator:dev
    container_name: insureai-mcp-users
    env_file:
      - ../../.env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8004"
    command: ["python", "mcp-servers/users/server.py"]
    expose:
      - "8004"
    restart: unless-stopped
    networks:
      - insureai
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # ── MCP: documents (read-only, PDF extraction) ──────────────
  mcp-documents:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.orchestrator
    image: insureai-orchestrator:dev
    container_name: insureai-mcp-documents
    env_file:
      - ../../.env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8005"
    command: ["python", "mcp-servers/documents/server.py"]
    expose:
      - "8005"
    restart: unless-stopped
    networks:
      - insureai
    volumes:
      - claim_uploads:/tmp/claim-uploads

  # ── MCP: legacy-provider (read-only, legacy DB) ─────────────
  mcp-legacy:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.orchestrator
    image: insureai-orchestrator:dev
    container_name: insureai-mcp-legacy
    env_file:
      - ../../.env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8006"
    command: ["python", "mcp-servers/legacy-provider/server.py"]
    expose:
      - "8006"
    restart: unless-stopped
    networks:
      - insureai
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # ── Optional local Postgres (enable via --profile local-db) ─
  postgres:
    image: postgres:16-alpine
    container_name: insureai-postgres
    profiles: ["local-db"]
    environment:
      POSTGRES_USER:     insureai
      POSTGRES_PASSWORD: dev
      POSTGRES_DB:       insureai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insureai -d insureai"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - insureai

  # ── One-shot Alembic migration runner (local-db profile) ────
  migrations:
    profiles: ["local-db"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.orchestrator
    image: insureai-orchestrator:dev
    container_name: insureai-migrations
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: "postgresql://insureai:dev@postgres:5432/insureai"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    working_dir: /app
    networks:
      - insureai
    restart: "no"

# ── Networks + volumes ──────────────────────────────────────
networks:
  insureai:
    name: insureai-dev

volumes:
  pgdata:
    name: insureai-pgdata
  claim_uploads:
    name: insureai-claim-uploads
