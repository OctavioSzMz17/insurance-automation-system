# ============================================================
# AI Orchestrator (FastAPI) — Kubernetes Deployment (C3.2)
#
# The ONLY service in this namespace that accepts external traffic.
# Reaches the three MCPs internally over ClusterIP services.
#
# Rules applied:
#   Rule 7  — Runs as non-root (runAsUser: 1000); JWT enforced at app layer
#   Rule 8  — All secrets from the `insureai-secrets` Secret
#   Rule 9  — CD pipeline (Blue/Green): maxSurge=1, maxUnavailable=0
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: insureai
  labels:
    app: orchestrator
    phase: c
    layer: api
spec:
  replicas: 2          # Fixed — do NOT enable HPA without setting maxReplicas
  selector:
    matchLabels:
      app: orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: orchestrator
        layer: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: orchestrator
          image: insureai-orchestrator:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: insureai-app-config
          env:
            # Secrets keep their own block so they don't leak via envFrom.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: insureai-secrets
                  key:  DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: insureai-secrets
                  key:  JWT_SECRET_KEY
            - name: LLM_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: insureai-secrets
                  key:  LLM_PROVIDER_API_KEY

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            # Shared upload dir — same PVC the documents MCP reads from
            - name: uploads
              mountPath: /uploads

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: insureai-pdf-uploads

      restartPolicy: Always

      # Spread replicas across nodes when possible
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: orchestrator
                topologyKey: kubernetes.io/hostname
