# ============================================================
# Secret TEMPLATE — fill values + apply OFFLINE
#
# This file is committed; the version with real values must NEVER be.
# Apply pattern (per environment):
#
#   cp infra/k8s/secrets/insureai-secrets.template.yaml /tmp/insureai-secrets.yaml
#   # Fill in the placeholder values
#   kubectl apply -f /tmp/insureai-secrets.yaml
#   rm /tmp/insureai-secrets.yaml
#
# Or use sealed-secrets / SOPS / Vault for proper GitOps secrets
# management — see docs.
#
# Rules applied:
#   Rule 8 — secrets never committed; .env on host, Secret in k8s
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: insureai-secrets
  namespace: insureai
  labels:
    app: insureai
type: Opaque
stringData:
  # ── PostgreSQL (Neon in prod) ────────────────────────────
  # Format: postgresql://USER:PASSWORD@HOST:PORT/DB?sslmode=require
  DATABASE_URL: "REPLACE_ME"

  # ── JWT signing key (HS256) ──────────────────────────────
  # Generate with:  python -c "import secrets; print(secrets.token_urlsafe(48))"
  JWT_SECRET_KEY: "REPLACE_ME"

  # ── LLM provider API key ─────────────────────────────────
  # Must match the LLM_PROVIDER set in insureai-app-config.
  # For claude → sk-ant-...   For openai → sk-...   For ollama → leave blank.
  LLM_PROVIDER_API_KEY: "REPLACE_ME"

  # Fix #91 ── MCP transport shared secret ──────────────────
  # All MCP servers validate every HTTP request against this value via
  # X-MCP-Secret header (HMAC compare_digest). Must be ≥ 32 characters.
  # Generate with:  openssl rand -hex 32
  MCP_SHARED_SECRET: "REPLACE_ME"

  # Fix #91 ── Audit-trail proposal signing key ─────────────
  # Used by append_reasoning to HMAC-sign [trace_id:TID] markers embedded
  # in ai_reasoning so auditors can detect tampered audit trails.
  # Generate with:  openssl rand -hex 32
  PROPOSAL_SIGNING_KEY: "REPLACE_ME"
