# ============================================================
# Legacy Provider MCP Server — Kubernetes Service (A3.5)
#
# ClusterIP only — internal to the cluster.
# The orchestrator reaches this service; it is never exposed
# to the public internet.
#
# Rules applied:
#   Rule 7  — MCP ↔ orchestrator via SSE; no external exposure
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: mcp-legacy-provider
  namespace: insureai
  labels:
    app: mcp-legacy-provider
    domain: legacy-data
spec:
  type: ClusterIP        # Internal only — not reachable from outside the cluster
  selector:
    app: mcp-legacy-provider
  ports:
    - name: sse
      protocol: TCP
      port: 8001         # Port the orchestrator connects to
      targetPort: 8001   # Port the container listens on (SSE transport)
