# ============================================================
# Legacy Provider MCP Server — Kubernetes Deployment (A3.5)
#
# Rules applied:
#   Rule 7  — Runs as non-root (runAsUser: 1000)
#   Rule 8  — DATABASE_URL injected from K8s Secret, never hardcoded
#   Rule 9  — CD pipeline (Blue/Green): maxSurge=1, maxUnavailable=0
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-legacy-provider
  namespace: insureai
  labels:
    app: mcp-legacy-provider
    phase: a
    domain: legacy-data
spec:
  replicas: 2          # Fixed — do NOT enable HPA without setting a maxReplicas cap
  selector:
    matchLabels:
      app: mcp-legacy-provider
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # Spin up one new pod before killing the old one
      maxUnavailable: 0    # Never have zero pods during a deploy (Rule 9)
  template:
    metadata:
      labels:
        app: mcp-legacy-provider
        domain: legacy-data
    spec:
      # ── Security: run as non-root (Rule 7) ─────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: mcp-legacy-provider
          # Image tagged by CI with git SHA + semver (Rule 7 / Operational Rule 7)
          image: mcp-legacy-provider:latest
          imagePullPolicy: IfNotPresent

          env:
            # DATABASE_URL injected from K8s Secret (Rule 8 — never hardcoded)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: insureai-db-secret
                  key: database-url

          # Resource limits — prevent a runaway MCP from starving other pods
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # Liveness: restart the container if the process dies
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 10
            periodSeconds: 30

          # Readiness: only route traffic once the server is ready
          readinessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 5
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      restartPolicy: Always
