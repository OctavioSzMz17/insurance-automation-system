# ============================================================
# Namespace — insureai (C3.2)
# Apply BEFORE any other manifests:
#   kubectl apply -f infra/k8s/namespace.yaml
#   kubectl apply -f infra/k8s/namespace-limits.yaml
#   kubectl apply -f infra/k8s/configmaps/app-config.yaml
#   kubectl apply -f infra/k8s/secrets/insureai-secrets.yaml   # local copy
#   kubectl apply -f infra/k8s/documents/    -f infra/k8s/legacy-provider/ \
#                  -f infra/k8s/claims/      -f infra/k8s/orchestrator/
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: insureai
  labels:
    app:    insureai
    layer:  orchestrator-and-mcps
    owned-by: platform
  annotations:
    description: "InsureAI orchestrator + all MCP servers"
