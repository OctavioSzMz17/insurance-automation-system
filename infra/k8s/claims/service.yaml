# ============================================================
# Claims MCP Server — Kubernetes Service (C3.2)
#
# ClusterIP only — internal access from the orchestrator over SSE.
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: mcp-claims
  namespace: insureai
  labels:
    app: mcp-claims
    domain: claims
spec:
  type: ClusterIP
  selector:
    app: mcp-claims
  ports:
    - name: sse
      protocol: TCP
      port: 8003           # claims MCP port (legacy=8001, documents=8002)
      targetPort: 8003
