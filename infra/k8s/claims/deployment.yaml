# ============================================================
# Claims MCP Server — Kubernetes Deployment (C3.2)
#
# Owns claim writes. Receives DATABASE_URL from the shared Secret.
# Rules applied:
#   Rule 3  — Write-restricted MCP; only the auditor agent reaches it
#   Rule 7  — Runs as non-root (runAsUser: 1000)
#   Rule 9  — CD pipeline (Blue/Green): maxSurge=1, maxUnavailable=0
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-claims
  namespace: insureai
  labels:
    app: mcp-claims
    phase: b
    domain: claims
spec:
  replicas: 2          # Fixed — do NOT enable HPA without a maxReplicas cap
  selector:
    matchLabels:
      app: mcp-claims
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mcp-claims
        domain: claims
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: mcp-claims
          image: mcp-claims:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: insureai-secrets
                  key:  DATABASE_URL
          envFrom:
            - configMapRef:
                name: insureai-app-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            exec:
              command: ["python", "-c", "import sqlalchemy; sys.exit(0)"]
            initialDelaySeconds: 5
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      restartPolicy: Always
