apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-documents
  namespace: insurance
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mcp-documents
      version: v1
  template:
    metadata:
      labels:
        app: mcp-documents
        version: v1
    spec:
      serviceAccountName: mcp-documents
      containers:
      - name: mcp-documents
        image: ghcr.io/your-org/insurance-automation/mcp-documents:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8005
          protocol: TCP
        env:
        - name: MCP_SERVER_PORT
          value: "8005"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: url
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: PDF_MAX_SIZE_MB
          value: "50"
        - name: OCR_ENABLED
          value: "true"

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache

      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - mcp-documents
              topologyKey: kubernetes.io/hostname
