# ============================================================
# Persistent Volume Claim — shared PDF upload storage
#
# Used by:
#   - ai-orchestrator → writes uploaded PDFs here
#   - mcp-documents   → reads PDFs from here (mounted read-only)
#
# Access mode: ReadWriteMany (RWX) — multiple pods read/write
# concurrently. Most cloud providers support RWX via NFS, EFS,
# Azure Files, or GCP Filestore.
#
# Storage size: 5Gi — enough for a few thousand 1-2 MB PDFs.
# Bump this for higher claim volume.
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: insureai-pdf-uploads
  namespace: insureai
  labels:
    app: insureai
    purpose: pdf-uploads
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  # storageClassName intentionally omitted — set per environment:
  #   AWS:   efs-sc
  #   GCP:   filestore-csi
  #   Azure: azurefile-csi
