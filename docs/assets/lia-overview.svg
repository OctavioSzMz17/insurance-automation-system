<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img"
     aria-label="LIA — Insurance Claims Automation: two read-only LLM agents propose, a deterministic layer decides, and a mutation gate is the only writer.">
  <title>LIA — Insurance Claims Automation</title>
  <desc>A claim PDF flows through an analyst agent, deterministic verification, an auditor agent and human review. A mutation gate that re-derives the verification is the only component allowed to write, through the claims MCP server into PostgreSQL.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.55" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#090e1a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.02" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#8ea2c6" fill-opacity="0.07"/>
    </pattern>
    <filter id="gateGlow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0.8 L9 5 L0 9.2 Z" fill="#5c7093"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0.8 L9 5 L0 9.2 Z" fill="#d99a1f"/>
    </marker>
    <marker id="arrowEm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.4" markerHeight="5.4" orient="auto-start-reverse">
      <path d="M0 0.8 L9 5 L0 9.2 Z" fill="#10b981"/>
    </marker>
  </defs>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <!-- canvas -->
    <rect width="1200" height="620" fill="url(#bg)"/>
    <rect width="1200" height="620" fill="url(#dots)"/>
    <rect width="1200" height="620" fill="url(#glowA)"/>
    <rect width="1200" height="620" fill="url(#glowB)"/>

    <!-- header -->
    <text x="60" y="86" font-size="50" font-weight="700" letter-spacing="1.5" fill="#f1f5f9">LIA</text>
    <line x1="160" y1="46" x2="160" y2="92" stroke="#26344c" stroke-width="1.4"/>
    <text x="180" y="70" font-size="21" font-weight="600" fill="#cbd5e1">Insurance Claims Automation</text>
    <text x="181" y="92" font-size="13.5" letter-spacing="0.4" fill="#34d399">the model proposes · the system decides</text>

    <g font-size="11.5" font-weight="600" text-anchor="middle">
      <rect x="702" y="52" width="150" height="30" rx="15" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.45"/>
      <text x="777" y="71.5" fill="#6ee7b7">19/19 contained</text>
      <rect x="866" y="52" width="150" height="30" rx="15" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.45"/>
      <text x="941" y="71.5" fill="#6ee7b7">200/200 invariants</text>
      <rect x="1030" y="52" width="110" height="30" rx="15" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="1085" y="71.5" fill="#a5b4fc">345 tests</text>
    </g>

    <!-- pipeline connectors -->
    <g stroke="#5c7093" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.85">
      <line x1="209" y1="188" x2="241" y2="188"/>
      <line x1="396" y1="188" x2="428" y2="188"/>
      <line x1="583" y1="188" x2="615" y2="188"/>
      <line x1="770" y1="188" x2="802" y2="188"/>
      <line x1="957" y1="188" x2="989" y2="188"/>
    </g>

    <!-- 01 claim pdf -->
    <g>
      <rect x="60.5" y="140.5" width="144" height="95" rx="11" fill="#111b2f" stroke="#28364f"/>
      <circle cx="80" cy="162" r="10" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.6"/>
      <text x="80" y="165.5" font-size="9.5" font-weight="700" text-anchor="middle" fill="#a5b4fc">01</text>
      <text x="132.5" y="196" font-size="13.5" font-weight="700" text-anchor="middle" fill="#e8eef9">claim PDF</text>
      <text x="132.5" y="214" font-size="9.2" text-anchor="middle" fill="#8696b0">size cap · magic bytes</text>
      <text x="132.5" y="228" font-size="9.2" text-anchor="middle" fill="#8696b0">server-generated id</text>
    </g>

    <!-- 02 analyst -->
    <g>
      <rect x="247.5" y="140.5" width="144" height="95" rx="11" fill="#1a1710" stroke="#5e4a1c"/>
      <circle cx="267" cy="162" r="10" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="267" y="165.5" font-size="9.5" font-weight="700" text-anchor="middle" fill="#fcd34d">02</text>
      <text x="319.5" y="196" font-size="13.5" font-weight="700" text-anchor="middle" fill="#f6e8c8">analyst agent</text>
      <text x="319.5" y="214" font-size="9.2" text-anchor="middle" fill="#b9a271">LangGraph ReAct</text>
      <text x="319.5" y="228" font-size="9.2" text-anchor="middle" fill="#b9a271">read-only · no write tools</text>
    </g>

    <!-- 03 verification -->
    <g>
      <rect x="434.5" y="140.5" width="144" height="95" rx="11" fill="#0d1b1a" stroke="#1e5247"/>
      <circle cx="454" cy="162" r="10" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="454" y="165.5" font-size="9.5" font-weight="700" text-anchor="middle" fill="#6ee7b7">03</text>
      <text x="506.5" y="196" font-size="13.5" font-weight="700" text-anchor="middle" fill="#dcf5ec">verification</text>
      <text x="506.5" y="214" font-size="9.2" text-anchor="middle" fill="#7fae9f">coverage · ownership</text>
      <text x="506.5" y="228" font-size="9.2" text-anchor="middle" fill="#7fae9f">identity · amount</text>
    </g>

    <!-- 04 auditor -->
    <g>
      <rect x="621.5" y="140.5" width="144" height="95" rx="11" fill="#1a1710" stroke="#5e4a1c"/>
      <circle cx="641" cy="162" r="10" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="641" y="165.5" font-size="9.5" font-weight="700" text-anchor="middle" fill="#fcd34d">04</text>
      <text x="693.5" y="196" font-size="13.5" font-weight="700" text-anchor="middle" fill="#f6e8c8">auditor agent</text>
      <text x="693.5" y="214" font-size="9.2" text-anchor="middle" fill="#b9a271">second opinion</text>
      <text x="693.5" y="228" font-size="9.2" text-anchor="middle" fill="#b9a271">facts override the model</text>
    </g>

    <!-- 05 human review -->
    <g>
      <rect x="808.5" y="140.5" width="144" height="95" rx="11" fill="#0f1a28" stroke="#1f4a63"/>
      <circle cx="828" cy="162" r="10" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="828" y="165.5" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7dd3fc">05</text>
      <text x="880.5" y="196" font-size="13.5" font-weight="700" text-anchor="middle" fill="#dbeefb">human review</text>
      <text x="880.5" y="214" font-size="9.2" text-anchor="middle" fill="#7ea7c2">HITL · every red flag</text>
      <text x="880.5" y="228" font-size="9.2" text-anchor="middle" fill="#7ea7c2">approve or reject</text>
    </g>

    <!-- 06 mutation gate -->
    <g filter="url(#gateGlow)">
      <rect x="995.5" y="140.5" width="144" height="95" rx="11" fill="#0c2220" stroke="#10b981" stroke-width="1.6"/>
      <circle cx="1015" cy="162" r="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.75"/>
      <text x="1015" y="165.5" font-size="9.5" font-weight="700" text-anchor="middle" fill="#a7f3d0">06</text>
      <g transform="translate(1108,153)">
        <path d="M3 7 V5.2 a3 3 0 0 1 6 0 V7" fill="none" stroke="#10b981" stroke-width="1.6"/>
        <rect x="0.6" y="7" width="10.8" height="8" rx="1.8" fill="#10b981" fill-opacity="0.85"/>
      </g>
      <text x="1067.5" y="196" font-size="13.5" font-weight="700" text-anchor="middle" fill="#d4fbee">mutation gate</text>
      <text x="1067.5" y="214" font-size="9.2" text-anchor="middle" fill="#79c6ad">re-derives from source</text>
      <text x="1067.5" y="228" font-size="9.2" text-anchor="middle" fill="#79c6ad">the only writer</text>
    </g>

    <!-- read-only links down to MCP -->
    <g stroke="#d99a1f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowAmber)" opacity="0.8">
      <line x1="319.5" y1="236" x2="319.5" y2="285"/>
      <line x1="693.5" y1="236" x2="693.5" y2="285"/>
    </g>
    <g font-size="9" fill="#c69a3c">
      <text x="330" y="268">read tools only</text>
      <text x="704" y="268">read tools only</text>
    </g>

    <!-- the only write path -->
    <path d="M1067.5 236 V262 H1018 V285" fill="none" stroke="#10b981" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowEm)"/>
    <text x="1008" y="256" font-size="9" font-weight="600" text-anchor="end" fill="#6ee7b7">the only write path</text>

    <!-- MCP layer -->
    <rect x="200.5" y="290.5" width="939" height="92" rx="12" fill="#0e1526" fill-opacity="0.9" stroke="#2b3a55" stroke-dasharray="6 5"/>
    <text x="216" y="306" font-size="9.5" letter-spacing="1.1" fill="#64748b">MCP SERVERS · ONE DOMAIN EACH · OUT-OF-PROCESS SSE · LEAST-PRIVILEGE DB ROLE</text>

    <g>
      <rect x="220.5" y="314.5" width="204" height="52" rx="9" fill="#131d33" stroke="#2f4061"/>
      <text x="322.5" y="337" font-size="12.5" font-weight="650" text-anchor="middle" fill="#dbe4f3">documents</text>
      <text x="322.5" y="353" font-size="9" text-anchor="middle" fill="#7b8ba6">:8004 · claim files</text>

      <rect x="452.5" y="314.5" width="204" height="52" rx="9" fill="#131d33" stroke="#2f4061"/>
      <text x="554.5" y="337" font-size="12.5" font-weight="650" text-anchor="middle" fill="#dbe4f3">users</text>
      <text x="554.5" y="353" font-size="9" text-anchor="middle" fill="#7b8ba6">:8003 · identity</text>

      <rect x="684.5" y="314.5" width="204" height="52" rx="9" fill="#131d33" stroke="#2f4061"/>
      <text x="786.5" y="337" font-size="12.5" font-weight="650" text-anchor="middle" fill="#dbe4f3">policies</text>
      <text x="786.5" y="353" font-size="9" text-anchor="middle" fill="#7b8ba6">:8002 · coverage</text>

      <rect x="916.5" y="314.5" width="204" height="52" rx="9" fill="#13231f" stroke="#10b981" stroke-opacity="0.55"/>
      <text x="1018.5" y="337" font-size="12.5" font-weight="650" text-anchor="middle" fill="#d4fbee">claims</text>
      <text x="1018.5" y="353" font-size="9" text-anchor="middle" fill="#79c6ad">:8001 · the write domain</text>
    </g>

    <!-- MCP to stores -->
    <g stroke="#5c7093" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.75">
      <line x1="322.5" y1="382" x2="322.5" y2="425"/>
      <line x1="554.5" y1="382" x2="554.5" y2="425"/>
      <line x1="786.5" y1="382" x2="786.5" y2="425"/>
      <line x1="1018.5" y1="382" x2="1018.5" y2="425"/>
    </g>

    <!-- stores -->
    <g>
      <rect x="220.5" y="430.5" width="204" height="54" rx="10" fill="#101a2c" stroke="#28364f"/>
      <text x="322.5" y="454" font-size="12" font-weight="650" text-anchor="middle" fill="#cbd5e1">shared volume</text>
      <text x="322.5" y="470" font-size="9" text-anchor="middle" fill="#7b8ba6">claim PDFs</text>

      <rect x="452.5" y="430.5" width="668" height="54" rx="10" fill="#101a2c" stroke="#3c4a86"/>
      <text x="786.5" y="454" font-size="12" font-weight="650" text-anchor="middle" fill="#c7d2fe">PostgreSQL</text>
      <text x="786.5" y="470" font-size="9" text-anchor="middle" fill="#8b96c4">one least-privilege role per domain · the orchestrator never connects directly</text>
    </g>

    <!-- invariants -->
    <g font-size="10.2" text-anchor="middle">
      <g>
        <rect x="60.5" y="519.5" width="170" height="33" rx="8" fill="#0f1726" stroke="#28364f"/>
        <rect x="242.5" y="519.5" width="170" height="33" rx="8" fill="#0f1726" stroke="#28364f"/>
        <rect x="424.5" y="519.5" width="170" height="33" rx="8" fill="#0f1726" stroke="#28364f"/>
        <rect x="606.5" y="519.5" width="170" height="33" rx="8" fill="#0f1726" stroke="#28364f"/>
        <rect x="788.5" y="519.5" width="170" height="33" rx="8" fill="#0f1726" stroke="#28364f"/>
        <rect x="970.5" y="519.5" width="170" height="33" rx="8" fill="#0f1726" stroke="#28364f"/>
      </g>
      <g fill="#9fb0c9">
        <text x="150.5" y="540">no write tools exist</text>
        <text x="332.5" y="540">identity is server-set</text>
        <text x="514.5" y="540">severity is computed</text>
        <text x="696.5" y="540">the handoff is signed</text>
        <text x="878.5" y="540">the gate re-derives</text>
        <text x="1060.5" y="540">it fails closed</text>
      </g>
      <g fill="#10b981">
        <circle cx="78" cy="536" r="2.6"/><circle cx="260" cy="536" r="2.6"/><circle cx="442" cy="536" r="2.6"/>
        <circle cx="624" cy="536" r="2.6"/><circle cx="806" cy="536" r="2.6"/><circle cx="988" cy="536" r="2.6"/>
      </g>
    </g>

    <text x="600" y="586" font-size="10.5" text-anchor="middle" fill="#64748b">345 tests · 25 adversarial cases · 19/19 neutralised with no help from the model behaving well · the whole suite in ~2 s, $0 of tokens</text>
  </g>
</svg>
